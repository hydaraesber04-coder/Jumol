name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Java JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Build Web App
      run: |
        if [ -f "package.json" ]; then
          npm install
          npm run build
        fi

    - name: Create Cordova Project & Configure
      run: |
        cordova create myApp com.jummal.app "حساب الجمل"
        rm -rf myApp/www/*

        # استخراج الملفات
        if [ -f "dist/index.html" ]; then
          echo "Using dist/"
          cp -r dist/* myApp/www/
        elif [ -f "site.zip" ]; then
          echo "Extracting site.zip..."
          mkdir -p temp_extracted
          unzip -o site.zip -d temp_extracted/
          INDEX_DIR=$(dirname $(find temp_extracted -name "index.html" | head -n 1))
          if [ -n "$INDEX_DIR" ]; then
            cp -r $INDEX_DIR/* myApp/www/
          fi
          rm -rf temp_extracted
        fi

        if [ ! -f "myApp/www/index.html" ]; then
          echo "ERROR: index.html was not found!"
          exit 1
        fi

        # تطبيق الإعدادات المعتمدة لأندرويد
        if [ -f "myApp/www/config.xml" ]; then
          cp myApp/www/config.xml myApp/config.xml
        elif [ -f "config.xml" ]; then
          cp config.xml myApp/config.xml
        else
          sed -i '/<\/widget>/i \    <preference name="scheme" value="https" />' myApp/config.xml
          sed -i '/<\/widget>/i \    <preference name="hostname" value="localhost" />' myApp/config.xml
          sed -i '/<\/widget>/i \    <preference name="KeepRunning" value="true" />' myApp/config.xml
          sed -i '/<\/widget>/i \    <allow-navigation href="https://localhost/*" />' myApp/config.xml
          sed -i '/<\/widget>/i \    <allow-navigation href="*" />' myApp/config.xml
        fi

        cd myApp
        cordova platform add android
        cordova build android --no-telemetry

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Jummal-App-APK
        path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
