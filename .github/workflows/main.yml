name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Cordova
      run: npm install -g cordova

    # بناء ملفات الويب تلقائياً وتجهيزها
    - name: Build Web App
      run: |
        if [ -f "package.json" ]; then
          npm install
          npm run build
        fi

    - name: Create Cordova Project & Configure
      run: |
        cordova create myApp com.jummal.app "حساب الجمل"
        rm -rf myApp/www/*

        # 1. إذا وجد ناتج البناء التلقائي dist يتم نقله فوراً
        if [ -d "dist" ]; then
          cp -r dist/* myApp/www/
        # 2. إذا كان هناك ملف site.zip يتم فك ضغطه
        elif [ -f "site.zip" ]; then
          unzip -o site.zip -d myApp/www/
          if [ -d "myApp/www/dist" ]; then
            cp -r myApp/www/dist/* myApp/www/
          elif [ -d "myApp/www/site" ]; then
            cp -r myApp/www/site/* myApp/www/
          fi
        fi

        # إعدادات كوردوفا الحاسمة لحل الشاشة البيضاء نهائياً
        sed -i '/<\/widget>/i \    <preference name="scheme" value="https" />' myApp/config.xml
        sed -i '/<\/widget>/i \    <preference name="hostname" value="localhost" />' myApp/config.xml
        sed -i '/<\/widget>/i \    <preference name="AndroidInsecureFileModeEnabled" value="true" />' myApp/config.xml
        sed -i '/<\/widget>/i \    <preference name="KeepRunning" value="true" />' myApp/config.xml
        sed -i '/<\/widget>/i \    <allow-navigation href="https://localhost/*" />' myApp/config.xml
        sed -i '/<\/widget>/i \    <allow-navigation href="http://*/*" />' myApp/config.xml
        sed -i '/<\/widget>/i \    <allow-navigation href="https://*/*" />' myApp/config.xml
        sed -i '/<\/widget>/i \    <allow-navigation href="file://*/*" />' myApp/config.xml

        cd myApp
        cordova platform add android
        cordova build android --no-telemetry

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Jummal-App-APK
        path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
